version: '3.8'

services:
  # Hardened Reverse Proxy with TLS & Rate Limiting
  sanita-proxy:
    image: nginx:alpine-slim
    container_name: sanita-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sanita_ssl:/etc/nginx/ssl:ro
    depends_on:
      - sanita-backend
    networks:
      - sanita-internal

  # Go Backend Service (Clean Architecture Gin API)
  sanita-backend:
    build:
      context: ../sanita-backend
      dockerfile: Dockerfile
    container_name: sanita-go-api
    restart: unless-stopped
    environment:
      PORT: 8080
      GIN_MODE: release
      SANITA_AES_KEY: ${SANITA_AES_KEY:-sanita-enterprise-aes-32byte-key!}
      SANITA_HMAC_SECRET: ${SANITA_HMAC_SECRET:-sanita-tamper-proof-hmac-key-2026}
      JWT_SECRET: ${JWT_SECRET:-sanita-super-secret-anti-breach-token-2026}
      DB_HOST: sanita-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sanita_user}
      DB_PASSWORD: ${DB_PASSWORD:-ReplaceWithStrongPassword2026!}
      DB_NAME: ${DB_NAME:-sanita}
      DB_SSLMODE: disable
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      - sanita-postgres
    networks:
      - sanita-internal

  # Secured PostgreSQL with Encrypted Volume
  sanita-postgres:
    image: postgres:16-alpine
    container_name: sanita-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sanita_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ReplaceWithStrongPassword2026!}
      POSTGRES_DB: ${DB_NAME:-sanita}
    volumes:
      - sanita_db_data:/var/lib/postgresql/data
    networks:
      - sanita-internal

networks:
  sanita-internal:
    driver: bridge

volumes:
  sanita_ssl:
  sanita_db_data: